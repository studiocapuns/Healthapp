<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nährwerk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-sized app shell; full-bleed on phones, framed device on desktop. Screens scroll inside, tab bar + sheets sit on top. */
:root{
  --bg:#E4EAE3; --screen:#F5F7F3; --surface:#FFFFFF; --surface-2:#ECF0E9;
  --ink:#15211A; --muted:#5C6A61; --line:#DCE3D9;
  --accent:#1E6A49; --accent-ink:#FFFFFF; --accent-soft:#DCEBE1;
  --protein:#3E6BD6; --carbs:#D08A1E; --fat:#CF5646;
  --frame:#1A211D; --scrim:rgba(14,22,17,.45);
  --tile-s:52%; --tile-l:87%;
  --shadow:0 1px 2px rgba(20,33,26,.06),0 6px 18px rgba(20,33,26,.05);
  --display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080C0A; --screen:#101712; --surface:#18211B; --surface-2:#1F2A23;
  --ink:#E7EEE9; --muted:#97A59C; --line:#2A3730;
  --accent:#5CC08E; --accent-ink:#06140D; --accent-soft:#1B3427;
  --protein:#86A6F2; --carbs:#EDB056; --fat:#EE8676;
  --frame:#000; --scrim:rgba(0,0,0,.6); --tile-s:30%; --tile-l:24%;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080C0A; --screen:#101712; --surface:#18211B; --surface-2:#1F2A23;
  --ink:#E7EEE9; --muted:#97A59C; --line:#2A3730;
  --accent:#5CC08E; --accent-ink:#06140D; --accent-soft:#1B3427;
  --protein:#86A6F2; --carbs:#EDB056; --fat:#EE8676;
  --frame:#000; --scrim:rgba(0,0,0,.6); --tile-s:30%; --tile-l:24%;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;display:flex;justify-content:center;align-items:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}

.device{position:relative;width:100%;height:100%;background:var(--screen);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:640px) and (min-height:720px){
  .device{width:400px;height:min(860px,calc(100% - 48px));border-radius:46px;border:10px solid var(--frame);box-shadow:0 30px 80px rgba(0,0,0,.25)}
}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
.view{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:14px 112px}
.ob .scroll{padding-bottom:28px}

/* type */
.title{font-family:var(--display);font-weight:700;font-size:29px;line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.h2{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:0}
.eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
p{margin:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:26px 0 10px}
.link{color:var(--accent);font-weight:600;font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.ic{flex:none;display:block}

/* surfaces */
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.soft{background:var(--accent-soft);border-radius:18px;padding:14px 16px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.garmin{background:var(--ink);color:var(--screen)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;font-weight:600;font-size:15px;background:var(--surface-2);transition:transform .12s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);color:var(--screen)}
.btn.line{background:transparent;border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px;border-radius:11px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;margin:0 calc(-1 * max(18px,env(safe-area-inset-left,0px)));padding:2px max(18px,env(safe-area-inset-left,0px));scrollbar-width:none}
.chips.scrollx::-webkit-scrollbar{display:none}
.chip{padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--screen)}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt .oi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);flex:none}
.opt.on .oi{background:var(--accent);color:var(--accent-ink)}
.opt b{display:block;font-size:15px}
.seg{display:flex;background:var(--surface-2);border-radius:13px;padding:3px;gap:2px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:48px;padding:10px 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface)}
.inp:focus{border-color:var(--accent);outline:none}
textarea.inp{min-height:84px;resize:vertical}
.unit{position:relative}
.unit span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=range]{width:100%;accent-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--surface-2);font-size:20px;font-weight:600}

/* onboarding */
.ob-top{display:flex;align-items:center;gap:12px;padding:14px max(18px,env(safe-area-inset-left,0px)) 6px}
.prog{flex:1;display:flex;gap:5px}
.prog i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.prog i.on{background:var(--accent)}
.ob-foot{padding:12px max(18px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--screen)}
.welcome{display:flex;flex-direction:column;gap:18px;padding-top:12px}
.hero-art{height:230px;border-radius:28px;background:var(--accent);position:relative;overflow:hidden}
.hero-art canvas{position:absolute;inset:0;width:100%;height:100%}
.big-title{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.02;letter-spacing:-.03em;margin:0;text-wrap:balance}
.note{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:9px 12px}
.target-big{font-family:var(--display);font-size:56px;font-weight:700;letter-spacing:-.03em;line-height:1}
.macros3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.macro{border-radius:16px;padding:12px;background:var(--surface)}
.macro b{display:block;font-family:var(--display);font-size:22px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* dashboard */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--screen);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px}
.kcal-card{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:128px;height:128px}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .mid b{font-family:var(--display);font-size:27px;line-height:1;letter-spacing:-.02em}
.kv{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.bar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;border-radius:9px}
.meal{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);text-align:left;width:100%}
.meal .info{flex:1;min-width:0}
.meal .info b{display:block;font-size:14.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile{border-radius:14px;display:grid;place-items:center;background:hsl(var(--h) var(--tile-s) var(--tile-l));flex:none}
.tile span{line-height:1}
.tile.s{width:56px;height:56px;font-size:28px}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.water{display:flex;gap:4px;flex-wrap:wrap}
.water button{width:30px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--line);background:var(--surface-2)}
.water button.on{color:var(--protein);background:color-mix(in srgb,var(--protein) 14%,var(--surface))}
.feed{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.feed:last-child{border-bottom:0}
.feed .fi{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--accent)}
.tip-card{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:16px;text-align:left;width:100%;display:block}
.tip-card .muted{color:inherit;opacity:.75}
.tip-card ul{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.tip-card li{display:flex;gap:10px;font-size:13.5px}
.tip-card li .t{font-variant-numeric:tabular-nums;font-weight:700;min-width:44px;opacity:.8}
.progressbar{height:10px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.progressbar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.metric{background:var(--surface-2);border-radius:12px;padding:8px;text-align:center}
.metric b{display:block;font-family:var(--display);font-size:16px}
.metric span{font-size:10.5px;color:var(--muted)}

/* recipes */
.search{position:relative}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:42px}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rcard{background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;position:relative}
.rcard .tile{border-radius:0;height:108px;font-size:46px}
.rcard .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.rcard b{font-size:14px;line-height:1.25}
.rcard .meta{font-size:11.5px;color:var(--muted);margin-top:auto}
.fav{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--surface) 85%,transparent);display:grid;place-items:center;color:var(--muted)}
.fav.on{color:var(--fat)}
.fav.on path{fill:currentColor}
.addcard{border:2px dashed var(--line);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:190px;color:var(--muted);font-weight:600;padding:12px;text-align:center}

/* calendar */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:14px}
.day span{font-size:11px;color:var(--muted);font-weight:600}
.day b{font-family:var(--display);font-size:18px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.day.today b{box-shadow:inset 0 0 0 1.5px var(--accent)}
.day.on{background:var(--ink)}
.day.on span{color:color-mix(in srgb,var(--screen) 70%,transparent)}
.day.on b{color:var(--screen)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dots i.m{background:var(--carbs)}
.train{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.train .ti{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.timeline{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:22px}
.timeline:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{position:relative}
.tl:before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--screen);border:2.5px solid var(--accent)}
.tl.train-pt:before{background:var(--accent)}
.tl .when{font-size:12px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.tl b{display:block;font-size:14px}
.tl .rlink{margin-top:6px;display:inline-flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-size:12.5px;font-weight:600}
.tl .rlink .tile{width:26px;height:26px;border-radius:8px;font-size:15px}
.slot{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);width:100%;text-align:left}
.slot.empty{background:transparent;box-shadow:none;border:1.5px dashed var(--line)}

/* progress */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--display);font-size:22px;letter-spacing:-.01em}
.chart > svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.mile{display:flex;align-items:center;gap:12px;padding:10px 0}
.mile .mi{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:transparent;flex:none}
.mile.done .mi{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.tabbar button.on{color:var(--accent)}

/* sheets */
.overlay{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:20}
.overlay.anim{animation:fade .2s ease}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--screen);border-radius:26px 26px 0 0;
  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.overlay.anim .sheet{animation:up .32s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.close{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.sheet .tile.xl{height:170px;border-radius:22px;font-size:84px}
.ing{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:0}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:flex;gap:12px}
.steps li:before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;display:grid;place-items:center}
.sticky-actions{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));margin:18px calc(-1 * max(18px,env(safe-area-inset-left,0px))) calc(-22px - env(safe-area-inset-bottom,0px));padding:12px max(18px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));background:var(--screen);border-top:1px solid var(--line);display:flex;gap:10px}
.listbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.listbtn:last-child{border-bottom:0}
.shop{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.shop.done .grow{text-decoration:line-through;color:var(--muted)}
.garmin-logo{width:56px;height:56px;border-radius:16px;background:var(--ink);color:var(--screen);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:24px}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:20px auto}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--screen);padding:11px 16px;border-radius:14px;font-weight:600;font-size:13.5px;z-index:40;max-width:calc(100% - 40px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.show{animation:toast .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{background:transparent}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toast{from{opacity:0;transform:translate(-50%,10px)}}
.screen-in{animation:sin .28s ease}
@keyframes sin{from{opacity:.4;transform:translateY(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="device" id="device">
  <div id="app"></div>
  <div id="toast" class="toast" role="status" hidden></div>
</div>
<script>
/* ============ Helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(n).toLocaleString('de-CH');
const pad = n => String(n).padStart(2,'0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };

  const pf = {sanft:.7, moderat:1, ambitioniert:1.35}[p.pace] || 1;
  const adj = {abnehmen:-450*pf, aufbau:250*pf, zunehmen:350*pf, halten:0, ausdauer:150}[p.goal];
  const kcal = Math.round(Math.max(tdee + adj, bmr) / 10) * 10;
  const pk = {abnehmen:2.0, aufbau:2.0, zunehmen:1.8, halten:1.7, ausdauer:1.6}[p.goal];
  const protein = Math.round(p.weight*pk);
  const fat = Math.round(Math.max(p.weight*0.9, kcal*0.25/9));
  const carbs = Math.max(60, Math.round((kcal - protein*4 - fat*9) / 4));
  const rate = p.goal==='abnehmen' ? 0.5*pf : (p.goal==='aufbau'||p.goal==='zunehmen') ? 0.25*pf : 0;
  const diff = hasTarget(p) ? p.target - p.weight : 0;
  const weeks = rate && Math.abs(diff) > 0.1 ? Math.ceil(Math.abs(diff)/rate) : 0;
  const bmi = p.weight / ((p.height/100)**2);
  const bf = p.bfUnknown ? estBf(p) : p.bf;
  const water = Math.round(p.weight*0.035*4)/4;
  return {bmr, tdee, kcal, protein, fat, carbs, weeks, bmi, bf, water, rate};
}
const hasTarget = p => ['abnehmen','aufbau','zunehmen'].includes(p.goal);
const estBf = p => { const bmi = p.weight/((p.height/100)**2); return clamp(Math.round(1.2*bmi + 0.23*p.age - 10.8*(p.sex==='m'?1:0) - 5.4), 6, 50); };
const burn = t => Math.round(SPORTS[t.type].k * INT[t.int].f * t.dur * (S.profile.weight/70));
const trainingsOn = key => S.trainings.filter(t => t.date===key).sort((a,b) => toMin(a.time)-toMin(b.time));
function dayTarget(key){
  const c = calc(); const b = trainingsOn(key).reduce((s,t) => s+burn(t), 0);
  const bonus = Math.round(b*0.5/10)*10;
  return {kcal:c.kcal+bonus, bonus, protein:c.protein, carbs:c.carbs+Math.round(bonus/4), fat:c.fat};
}
const allRecipes = () => [...S.custom, ...RECIPES];
const getR = id => allRecipes().find(r => r.id===id);
function fits(r, p = S.profile){
  if (r.custom) return true;
  if (!DIET_OK[p.diet].includes(r.diet)) return false;
  if (p.diet==='lowcarb' && r.c > 30) return false;
  return !r.al.some(a => p.allergies.includes(a));
}
const isHP = r => r.p*4/r.kcal >= .28;
const isLC = r => r.c <= 25;
function suggest(slot, key){
  let pool = allRecipes().filter(r => !r.custom && fits(r) && r.meals.includes(slot));
  const tr = trainingsOn(key);
  const pick = tag => { const x = pool.filter(r => r.tags.includes(tag)); if (x.length) pool = x; };
  if (slot==='snack' && tr.some(t => toMin(t.time) >= 12*60)) pick('pre');
  if (slot==='abend' && tr.some(t => toMin(t.time) >= 15*60)) pick('post');
  if (slot==='fruehstueck' && tr.some(t => toMin(t.time) < 10*60)) pick('post');
  if (!pool.length) pool = allRecipes().filter(r => fits(r));
  if (!pool.length) return null;
  return pool[hashStr(key+slot) % pool.length];
}
function planned(key, slot){
  const v = S.plan[key]?.[slot];
  if (v === '') return null;
  if (v) return getR(v) || null;
  return suggest(slot, key);
}
const isUserPlanned = (key, slot) => !!S.plan[key]?.[slot];
const logOf = key => S.log[key] || [];
const sumLog = key => logOf(key).reduce((a,e) => ({kcal:a.kcal+e.kcal, p:a.p+e.p, c:a.c+e.c, f:a.f+e.f}), {kcal:0,p:0,c:0,f:0});
function logRecipe(r, slot, key, serv = 1){
  (S.log[key] ||= []).push({id:uid(), rid:r.id, slot, name:r.n, kcal:Math.round(r.kcal*serv), p:Math.round(r.p*serv), c:Math.round(r.c*serv), f:Math.round(r.f*serv)});
}
const eatenEntry = (key, slot, rid) => logOf(key).find(e => e.slot===slot && e.rid===rid);
const pickTagged = (tag, seed) => { const pool = RECIPES.filter(r => fits(r) && r.tags.includes(tag)); return pool.length ? pool[hashStr(seed) % pool.length] : null; };

function tipsFor(t){
  const w = S.profile.weight, sp = SPORTS[t.type], start = toMin(t.time), end = start + t.dur;
  const hard = t.int !== 'locker', long = t.dur >= 75, out = [];
  if (t.type === 'yoga'){
    out.push({at:start-120, title:'Leicht essen', text:'Letzte grössere Mahlzeit etwa 2 Stunden vorher, danach nur Wasser oder Tee.'});
    out.push({at:end+30, title:'Danach', text:'Normale Mahlzeit mit Protein und Gemüse. Kein spezieller Recovery-Bedarf.'});
    return out;
  }
  const gpk = long ? 1.5 : 1;
  if (start >= 9*60) out.push({at:start-180, title:'Mahlzeit vor dem Training', text:`ca. ${Math.round(w*gpk/5)*5} g Kohlenhydrate (${gpk} g/kg), etwas Protein, wenig Fett und Ballaststoffe – z. B. Reis, Pasta oder Brot.`});
  else out.push({at:start-45, title:'Frühes Training', text: hard ? 'Kleiner Snack mit 20–30 g schnellen Kohlenhydraten, z. B. eine Banane oder Toast mit Honig.' : 'Bei lockerer Einheit ist nüchtern okay. Ein Glas Wasser reicht.', rid: hard ? pickTagged('pre', t.id)?.id : null});
  if (hard && start >= 9*60) out.push({at:start-45, title:'Snack 30–60 Min. vorher', text:'20–30 g leicht verdauliche Kohlenhydrate für volle Speicher.', rid:pickTagged('pre', t.id)?.id});
  if (long && sp.endu) out.push({at:start+30, title:'Während der Einheit', text:`${t.dur >= 120 ? '60' : '30–60'} g Kohlenhydrate und 500–750 ml Flüssigkeit pro Stunde.`});
  const post = {at:end+20, title:'Recovery innerhalb 60 Min.', text:`${Math.round(w*0.3)} g Protein${sp.endu || t.type==='hiit' ? ` + ${Math.round(w*(long?1.2:0.8))} g Kohlenhydrate` : ''} für Reparatur und Glykogen.`, rid:pickTagged('post', t.id+'p')?.id};
  out.push(post);
  if (t.type === 'kraft') out.push({at:null, title:'Protein über den Tag verteilen', text:`Dein Ziel von ${calc().protein} g auf 4 Mahlzeiten à ~${Math.round(calc().protein/4)} g verteilen – so nutzt dein Körper es am besten.`});
  if (S.garmin.connected && sp.endu && hard) out.push({at:null, title:'Flüssigkeit (Garmin)', text:`Geschätzter Schweissverlust: ~${fmt(t.dur*11)} ml. Danach ca. ${fmt(t.dur*11*1.5)} ml trinken.`});
  return out;
}

  const add = (off, time, type, dur, int) => S.trainings.push({id:uid(), date:dkey(addDays(t,off)), time, type, name:SPORTS[type].demo, dur, int, src:'manuell'});
  add(0, '18:00', sp[0], 45, 'intensiv');

  S.startWeight = start; S.startDate = dkey(addDays(t, -42)); S.planWeeks = 6 + (c.weeks || 8);

  S.weights = Array.from({length:7}, (_, i) => ({d:dkey(addDays(t, -42 + i*7)), kg:+(start + (p.weight - start)*(i/6) + (dir ? noise[i] : noise[i]*1.4)).toFixed(1)}));
  S.hist = {}; S.histP = {};

  S.log = {}; S.plan = {}; S.water = {[dkey(t)]:3}; S.selDay = dkey(t);
  const br = suggest('fruehstueck', dkey(t)); if (br) logRecipe(br, 'fruehstueck', dkey(t));
}

function trainingHint(key, slot){
  const tr = trainingsOn(key); if (!tr.length) return '';
  if (slot==='snack' && tr.some(t => toMin(t.time) >= 12*60)) return ' · Pre-Workout';
  if (slot==='abend' && tr.some(t => toMin(t.time) >= 15*60)) return ' · Recovery';
  if (slot==='fruehstueck' && tr.some(t => toMin(t.time) < 10*60)) return ' · Recovery';
  return '';
}

/* --- progress --- */
function viewProgress(){
  const p = S.profile, c = calc(), w = S.weights, cur = w.length ? w[w.length-1].kg : p.weight;
  const start = S.startWeight ?? cur, delta = cur - start, t = today();
  const days = Array.from({length:7}, (_, i) => dkey(addDays(t, i-6)));
  const kc = days.map(k => k===dkey(t) ? sumLog(k).kcal : (S.hist[k] ?? 0));
  const pHit = Object.values(S.histP).filter(v => v >= c.protein).length;
  const bfNow = c.bf, bfStart = +(bfNow + (p.goal==='abnehmen' ? 1.6 : p.goal==='aufbau' ? 0.4 : 0.2)).toFixed(1);
  const lost = Math.abs(delta);
  const miles = hasTarget(p) ? [
    ['Plan gestartet', true], ['Erste Woche durchgezogen', true], [`${p.goal==='abnehmen'?'−':'+'}2 kg erreicht`, lost >= 2],
    ['Halbzeit', lost >= Math.abs(start - p.target)/2], [`Zielgewicht ${p.target} kg`, Math.abs(cur - p.target) < .2]]
    : [['Plan gestartet', true], ['Erste Woche durchgezogen', true], ['4 Wochen konstant ±1 kg', true], ['12 Wochen dabei', false]];
  return `<div class="screen-in">
  <div class="topbar"><div><div class="eyebrow">Demo-Verlauf · seit ${S.startDate ? parseKey(S.startDate).toLocaleDateString('de-CH',{day:'numeric',month:'long'}) : 'heute'}</div><h1 class="title">Fortschritt</h1></div></div>
  <div class="stats3">
    <div class="stat"><span class="small muted">Aktuell</span><b class="num">${cur.toFixed(1)}</b><span class="small muted">kg</span></div>
    <div class="stat"><span class="small muted">Veränderung</span><b class="num" style="color:var(--accent)">${delta>0?'+':delta<0?'−':'±'}${Math.abs(delta).toFixed(1)}</b><span class="small muted">kg</span></div>
    <div class="stat"><span class="small muted">${hasTarget(p)?'Ziel':'Körperfett'}</span><b class="num">${hasTarget(p)?p.target:bfNow}</b><span class="small muted">${hasTarget(p)?'kg':'%'}</span></div>
  </div>

  <div class="sec-h"><h2 class="h2">Gewicht</h2><span class="small muted">wöchentlich</span></div>
  <div class="card chart">${weightChart(w, hasTarget(p) ? p.target : null)}
    <form class="row" style="margin-top:12px" data-form="weigh"><div class="unit grow"><input id="f-weigh" class="inp num" type="number" step="0.1" inputmode="decimal" placeholder="Gewicht heute" aria-label="Heutiges Gewicht"><span>kg</span></div><button type="submit" class="btn primary">${ic('scale',18)} Eintragen</button></form></div>

  <div class="sec-h"><h2 class="h2">Kalorien · 7 Tage</h2><span class="small muted num">Ziel ${fmt(c.kcal)}</span></div>
  <div class="card chart">${kcalChart(days, kc, c.kcal)}</div>

  <div class="grid2" style="margin-top:12px">
    <div class="stat"><span class="small muted">Proteinziel erreicht</span><b class="num">${pHit} / 6</b><span class="small muted">letzte Tage</span></div>
    <div class="stat"><span class="small muted">Körperfett${p.bfUnknown?' (geschätzt)':''}</span><b class="num">${bfStart} → ${bfNow} %</b><span class="small muted">seit Start</span></div>
  </div>

  <div class="sec-h"><h2 class="h2">Meilensteine</h2></div>
  <div class="card" style="padding:4px 16px">${miles.map(([l,d]) => `<div class="mile ${d?'done':''}"><span class="mi">${ic('check',16,3)}</span><b class="${d?'':'muted'}" style="font-weight:${d?600:500}">${l}</b></div>`).join('')}</div>
  </div>`;
}
function weightChart(w, target){
  if (!w.length) return '<p class="muted">Noch keine Daten.</p>';
  const W = 320, H = 170, L = 34, R = 12, T = 12, B = 24;
  const vals = w.map(x => x.kg).concat(target != null ? [target] : []);
  let mn = Math.floor(Math.min(...vals) - .5), mx = Math.ceil(Math.max(...vals) + .5);
  const x = i => L + (w.length === 1 ? 0 : i*(W-L-R)/(w.length-1)), y = v => T + (mx - v)*(H-T-B)/(mx-mn);
  const step = Math.max(1, Math.round((mx-mn)/4));
  let grid = ''; for (let v = mn; v <= mx; v += step) grid += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  const pts = w.map((p,i) => `${x(i)},${y(p.kg)}`).join(' ');
  const area = `M${x(0)},${H-B} L${w.map((p,i) => `${x(i)},${y(p.kg)}`).join(' L')} L${x(w.length-1)},${H-B} Z`;
  const last = w[w.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsverlauf">
    <defs><linearGradient id="wg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    ${target != null ? `<line x1="${L}" x2="${W-R}" y1="${y(target)}" y2="${y(target)}" stroke="var(--accent)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W-R}" y="${y(target)-5}" text-anchor="end" style="fill:var(--accent);font-weight:600">Ziel ${target}</text>` : ''}
    <path d="${area}" fill="url(#wg)"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${w.map((p,i) => `<circle cx="${x(i)}" cy="${y(p.kg)}" r="${i===w.length-1?5:3}" fill="${i===w.length-1?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>`).join('')}
    <text x="${x(w.length-1)}" y="${y(last.kg)-10}" text-anchor="end" style="fill:var(--ink);font-weight:700;font-size:11px">${last.kg.toFixed(1)} kg</text>
    ${w.map((p,i) => (i % 2 === 0 || i === w.length-1) ? `<text x="${x(i)}" y="${H-6}" text-anchor="middle">${parseKey(p.d).getDate()}.${parseKey(p.d).getMonth()+1}.</text>` : '').join('')}
  </svg>`;
}
function kcalChart(days, kc, target){
  const W = 320, H = 150, L = 8, R = 8, T = 14, B = 22, mx = Math.max(target*1.25, ...kc);
  const bw = (W-L-R)/7, y = v => T + (1 - v/mx)*(H-T-B);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kalorien der letzten 7 Tage">
    ${kc.map((v,i) => { const over = v > target*1.05, isT = i===6; const h = Math.max(2, (H-B) - y(v));
      return `<rect x="${L+i*bw+bw*.2}" y="${y(v)}" width="${bw*.6}" height="${h}" rx="6" fill="${isT?'var(--ink)':over?'var(--carbs)':'var(--accent)'}" opacity="${isT?1:.85}"/>
      <text x="${L+i*bw+bw/2}" y="${H-6}" text-anchor="middle" style="${isT?'fill:var(--ink);font-weight:700':''}">${isT?'Heute':WD[parseKey(days[i]).getDay()]}</text>`; }).join('')}
    <line x1="${L}" x2="${W-R}" y1="${y(target)}" y2="${y(target)}" stroke="var(--muted)" stroke-dasharray="4 4"/>
  </svg>`;
}

/* ============ Render ============ */
let lastView = '';
function render(){
  const viewId = S.onboarded ? 'tab:' + S.tab : 'ob:' + S.step;
  const sc = document.querySelector('.scroll'), st = sc ? sc.scrollTop : 0;
  const sh = document.querySelector('.sheet'), sst = sh ? sh.scrollTop : 0;
  const hadSheet = !!sh;
  $('#app').innerHTML = (S.onboarded ? appView() : onboardingView()) + sheetView();
  const sc2 = document.querySelector('.scroll');
  if (sc2 && viewId === lastView) sc2.scrollTop = st;
  const sh2 = document.querySelector('.sheet');
  if (sh2 && hadSheet && !S._sheetNew) sh2.scrollTop = sst;
  if (viewId !== lastView) document.querySelectorAll('.screen-in').forEach(el => el.classList.add('screen-in'));
  else document.querySelectorAll('.screen-in').forEach(el => el.classList.remove('screen-in'));
  lastView = viewId; S._sheetNew = false;
  if (!S.onboarded && S.step === 0) drawHero();
  save();
}
function openSheet(obj){ S.sheet = obj; S._sheetNew = true; render(); }
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.hidden = false; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2300);
}

/* Hero: generative plate of "ingredients" — rings of dots in macro colours */
function drawHero(){
  const cv = document.getElementById('heroCanvas'); if (!cv) return;
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = r.width*dpr; cv.height = r.height*dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--protein','--carbs','--fat','--accent-soft'].map(v => cs.getPropertyValue(v).trim());
  const cx = r.width*0.62, cy = r.height*0.55;
  let seed = 11; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  g.fillStyle = 'rgba(255,255,255,.08)';
  [150,112,74].forEach(rad => { g.beginPath(); g.arc(cx, cy, rad, 0, Math.PI*2); g.fill(); });
  for (let i = 0; i < 140; i++){
    const a = rnd()*Math.PI*2, d = 20 + Math.sqrt(rnd())*130, s = 3 + rnd()*9;
    g.fillStyle = cols[Math.floor(rnd()*cols.length)]; g.globalAlpha = .55 + rnd()*.45;
    g.beginPath(); g.ellipse(cx + Math.cos(a)*d, cy + Math.sin(a)*d*0.8, s, s*(0.6+rnd()*0.5), a, 0, Math.PI*2); g.fill();
  }
  g.globalAlpha = 1; g.fillStyle = '#fff'; g.font = '700 15px Inter, system-ui, sans-serif';
  g.fillText(`${fmt(calc().kcal)} kcal`, 20, 34);
  g.font = '500 12px Inter, system-ui, sans-serif'; g.globalAlpha = .8;
  g.fillText(`${calc().protein} g Protein · ${calc().carbs} g KH · ${calc().fat} g Fett`, 20, 54);
}

/* ============ Actions ============ */
const A = {
  noop(){},
  close(){ S.sheet = null; render(); },
  obNext(){
    const st = STEPS[S.step], p = S.profile;
    if (st === 'koerper'){
      p.age = clamp(Math.round(p.age) || 30, 14, 99); p.height = clamp(Math.round(p.height) || 170, 120, 230);
      p.weight = clamp(+p.weight || 70, 35, 250); p.target = clamp(+p.target || p.weight, 35, 250);
      if (p.goal === 'abnehmen' && p.target >= p.weight) p.target = +(p.weight - 4).toFixed(1);
      if ((p.goal === 'aufbau' || p.goal === 'zunehmen') && p.target <= p.weight) p.target = +(p.weight + 3).toFixed(1);
    }
    if (st === 'training' && !p.sports.length){ toast('Wähle mindestens eine Sportart'); return; }
    if (S.step < STEPS.length - 1){ S.step++; render(); return; }
    seedDemo(); S.onboarded = true; S.tab = 'heute'; render(); toast('Dein Plan ist bereit');
  },
  obBack(){ if (S.step > 0){ S.step--; render(); } },
  set(d){ S.profile[d.k] = d.v; render(); },
  flag(d){ S.profile[d.k] = !S.profile[d.k]; render(); },
  tog(d){ const arr = S.profile[d.k], i = arr.indexOf(d.v); i >= 0 ? arr.splice(i, 1) : arr.push(d.v); render(); },
  days(d){ S.profile.days = clamp(S.profile.days + Number(d.v), 0, 7); render(); },
  tab(d){ S.tab = d.v; S.sheet = null; render(); },
  gocal(d){ S.tab = 'kalender'; S.selDay = d.v; render(); },
  sheet(d){ const o = {type:d.v}; if (d.v === 'quick') o.slot = MEALS[Math.min(3, Math.floor(Math.max(0, new Date().getHours() - 6)/4))][0]; openSheet(o); },
  recipe(d){ openSheet({type:'recipe', id:d.v, serv:1}); },
  serv(d){ S.sheet.serv = clamp((S.sheet.serv || 1) + Number(d.v), 1, 6); render(); },
  fav(d){ const i = S.fav.indexOf(d.v); if (i >= 0){ S.fav.splice(i, 1); toast('Aus Sammlung entfernt'); } else { S.fav.push(d.v); toast('Zur Sammlung hinzugefügt'); } render(); },
  eat(d){
    const r = planned(d.k, d.v); if (!r) return;
    const e = eatenEntry(d.k, d.v, r.id);
    if (e) S.log[d.k] = logOf(d.k).filter(x => x !== e); else { logRecipe(r, d.v, d.k); toast(`${r.kcal} kcal erfasst`); }
    render();
  },
  eatRecipe(d){
    const r = getR(d.v), sv = S.sheet?.serv || 1, key = dkey(today());
    const slot = MEALS.find(([s]) => planned(key, s)?.id === r.id && !eatenEntry(key, s, r.id))?.[0] || r.meals[0];
    logRecipe(r, slot, key, sv); S.sheet = null; render(); toast(`${Math.round(r.kcal*sv)} kcal als ${MEAL_T[slot]} erfasst`);
  },
  unlog(d){ const k = dkey(today()); S.log[k] = logOf(k).filter(e => e.id !== d.v); render(); },
  water(d){ const k = dkey(today()), v = Number(d.v); S.water[k] = (S.water[k] || 0) === v ? v - 1 : v; render(); },
  rmode(d){ S.rmode = d.v; render(); },
  rfilter(d){ S.rfilter = d.v; render(); },
  day(d){ S.selDay = d.v; render(); },
  week(d){ S.selDay = dkey(addDays(parseKey(S.selDay), Number(d.v))); render(); },
  pick(d){ openSheet({type:'pick', key:d.k, slot:d.v}); },
  pickSet(d){ const {key, slot} = S.sheet; (S.plan[key] ||= {})[slot] = d.v; S.sheet = null; render(); toast(d.v ? 'Eingeplant' : 'Mahlzeit geleert'); },
  planTo(d){ openSheet({type:'planTo', id:d.v, day:dkey(addDays(today(), 1)), slot:getR(d.v).meals[0]}); },
  ptDay(d){ S.sheet.day = d.v; render(); },
  ptSlot(d){ S.sheet.slot = d.v; render(); },
  ptSave(){ const {id, day, slot} = S.sheet; (S.plan[day] ||= {})[slot] = id; S.sheet = null; render(); toast(`Eingeplant: ${parseKey(day).toLocaleDateString('de-CH',{weekday:'long'})}, ${MEAL_T[slot]}`); },
  qSlot(d){ S.sheet.slot = d.v; render(); },
  qAdd(d){ const q = QUICK[d.v], k = dkey(today()); (S.log[k] ||= []).push({id:uid(), slot:S.sheet.slot, name:q[0], kcal:q[1], p:q[2], c:q[3], f:q[4]}); S.sheet = null; render(); toast(`${q[0]} erfasst`); },
  addTraining(){ openSheet({type:'addTraining', draft:{type:'laufen', name:SPORTS.laufen.t, date:S.selDay, time:'18:00', dur:45, int:'mittel'}}); },
  dType(d){ const dr = S.sheet.draft; if (!dr.name || Object.values(SPORTS).some(s => s.t === dr.name)) dr.name = SPORTS[d.v].t; dr.type = d.v; render(); },
  dDate(d){ S.sheet.draft.date = d.v; render(); },
  dInt(d){ S.sheet.draft.int = d.v; render(); },
  delTraining(d){ S.trainings = S.trainings.filter(t => t.id !== d.v); render(); toast('Training gelöscht'); },
  garmin(){ openSheet({type:'garmin', phase:'consent'}); },
  gallow(){
    S.sheet.phase = 'sync'; render();
    setTimeout(() => {
      S.garmin.connected = true;
      const t = today(), have = S.trainings.some(x => x.src === 'garmin');
      if (!have){
        S.trainings.push({id:uid(), date:dkey(addDays(t,-1)), time:'07:10', type:'laufen', name:'Lauf locker · 8.2 km', dur:48, int:'locker', src:'garmin'});
        S.trainings.push({id:uid(), date:dkey(addDays(t,-4)), time:'12:05', type:'rad', name:'Rad · 32.5 km', dur:75, int:'mittel', src:'garmin'});
      }
      S.sheet = null; render(); toast('Garmin verbunden · 2 Aktivitäten importiert');
    }, 1600);
  },
  gsync(){ toast('Garmin synchronisiert · keine neuen Aktivitäten'); },
  gdisconnect(){ S.garmin.connected = false; S.trainings = S.trainings.filter(x => x.src !== 'garmin'); S.sheet = null; render(); toast('Garmin getrennt'); },
  shopTog(d){ S.shopDone[d.v] = !S.shopDone[d.v]; render(); },
  reOnboard(){ S.sheet = null; S.onboarded = false; S.step = 1; render(); },
  reset(){
    if (S.sheet?.confirmReset){ S = fresh(); lastView = ''; render(); toast('Prototyp zurückgesetzt'); return; }
    S.sheet.confirmReset = true; toast('Nochmals tippen, um alles zu löschen');
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (fn) fn(el.dataset, el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f){
    const k = el.dataset.f;
    S.profile[k] = (el.type === 'number' || el.type === 'range') ? Number(el.value) : el.value;
    if (k === 'bf'){ const v = $('#bfv'); if (v) v.textContent = el.value + ' %'; }
    if (['weight','height'].includes(k)){ const b = $('#bmi'); if (b) b.textContent = calc().bmi.toFixed(1); }
    save();
  }
  if (el.dataset.d && S.sheet?.draft) S.sheet.draft[el.dataset.d] = el.type === 'number' ? Number(el.value) : el.value;
  if (el.id === 'q'){ S.q = el.value; const l = $('#rlist'); if (l) l.innerHTML = recipeGrid(); }
});
document.addEventListener('submit', e => {
  const f = e.target.dataset.form; if (!f) return; e.preventDefault();
  const val = id => document.getElementById(id)?.value ?? '';
  if (f === 'weigh'){
    const kg = parseFloat(val('f-weigh').replace(',', '.'));
    if (!(kg > 30 && kg < 300)){ toast('Bitte ein Gewicht zwischen 30 und 300 kg eingeben'); return; }
    const k = dkey(today()); S.weights = S.weights.filter(w => w.d !== k); S.weights.push({d:k, kg:+kg.toFixed(1)}); S.profile.weight = +kg.toFixed(1);
    render(); toast(`${kg.toFixed(1)} kg eingetragen · Ziele neu berechnet`);
  }
  if (f === 'quick'){
    const k = dkey(today()), kcal = Math.round(+val('q-k'));
    if (!val('q-n').trim() || !(kcal > 0)){ toast('Name und Kalorien angeben'); return; }
    (S.log[k] ||= []).push({id:uid(), slot:S.sheet.slot, name:val('q-n').trim(), kcal, p:Math.round(+val('q-p') || 0), c:0, f:0});
    S.sheet = null; render(); toast('Erfasst');
  }
  if (f === 'training'){
    const d = S.sheet.draft; d.dur = clamp(Math.round(+d.dur) || 45, 5, 600); if (!d.time) d.time = '18:00';
    S.trainings.push({id:uid(), ...d, name:(d.name || SPORTS[d.type].t).trim(), src:'manuell'}); S.selDay = d.date; S.sheet = null; render(); toast('Training gespeichert · Tipps aktualisiert');
  }
  if (f === 'own'){
    const n = val('o-n').trim(), kcal = Math.round(+val('o-k'));
    if (!n || !(kcal > 0)){ toast('Name und Kalorien angeben'); return; }
    const p = Math.round(+val('o-p') || 0), c = Math.round(+val('o-c') || 0), fat = Math.max(0, Math.round((kcal - p*4 - c*4)/9));
    const ing = val('o-i').split('\n').map(s => s.trim()).filter(Boolean).map(s => { const m = s.match(/^([\d.,]+)\s*(\S+)\s+(.+)$/); return m ? [parseFloat(m[1].replace(',', '.')), m[2], m[3]] : [0, '', s]; });
    const r = {id:'c' + uid(), custom:true, n, e:'🍽️', h:hashStr(n) % 360, meals:[val('o-m')], tags:[], diet:'vegan', al:[], kcal, p, c, f:fat, min:Math.round(+val('o-t') || 20), ing, st:val('o-s').split('\n').map(s => s.trim()).filter(Boolean)};
    S.custom.unshift(r); S.fav.unshift(r.id); S.rmode = 'sammlung'; S.tab = 'rezepte'; S.sheet = null; render(); toast('Rezept in deiner Sammlung gespeichert');
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet){ S.sheet = null; render(); } });
window.addEventListener('resize', () => { if (!S.onboarded && S.step === 0) drawHero(); });

render();
if (document.fonts) document.fonts.ready.then(() => { if (!S.onboarded && S.step === 0) drawHero(); });
</script>
</body>
</html>
