<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiber</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: soft-grey phone shell; frosted glass cards on a quiet grey ground, one dark "night" stage
   with lime-glow cards for what's actionable today, floating pill tab bar. Two-tone stacked titles. */
:root{
  --page:#C7CBCD; --screen:#E6E7E7; --raised:#F1F2F2;
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(250,250,250,.78); --glass-line:rgba(255,255,255,.75);
  --ink:#111213; --ink-2:#85898D; --muted:#5F6367; --line:rgba(17,18,19,.08);
  --lime:#C6EE52; --lime-ink:#1A2207; --lime-text:#4D690B;
  --night:#0E0F0F; --night-2:#1A1B1B; --night-line:rgba(255,255,255,.08); --night-ink:#EEEFEA; --night-muted:#93978F;
  --protein:#6F86F0; --carbs:#D5A93E; --fat:#DE735E;
  --frame:#151616; --scrim:rgba(20,22,22,.32);
  --shadow:0 1px 1px rgba(0,0,0,.03),0 10px 30px rgba(30,34,36,.07);
  --display:'Urbanist',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --spring:cubic-bezier(.32,.72,0,1);
  --g:max(20px,env(safe-area-inset-left,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#000; --screen:#0B0C0C; --raised:#161717;
  --glass:rgba(255,255,255,.055); --glass-strong:rgba(28,29,29,.82); --glass-line:rgba(255,255,255,.07);
  --ink:#F0F1EE; --ink-2:#6F7376; --muted:#9A9E9F; --line:rgba(255,255,255,.08);
  --lime-text:#C6EE52;
  --night:#151616; --night-2:#202121;
  --protein:#93A6F6; --carbs:#E8C063; --fat:#EE8E7A;
  --frame:#000; --scrim:rgba(0,0,0,.55); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#000; --screen:#0B0C0C; --raised:#161717;
  --glass:rgba(255,255,255,.055); --glass-strong:rgba(28,29,29,.82); --glass-line:rgba(255,255,255,.07);
  --ink:#F0F1EE; --ink-2:#6F7376; --muted:#9A9E9F; --line:rgba(255,255,255,.08);
  --lime-text:#C6EE52;
  --night:#151616; --night-2:#202121;
  --protein:#93A6F6; --carbs:#E8C063; --fat:#EE8E7A;
  --frame:#000; --scrim:rgba(0,0,0,.55); --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;display:flex;justify-content:center;align-items:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--lime-text);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.press{transition:transform .14s ease-out}
.press:active{transform:scale(.97)}

.device{position:relative;width:100%;height:100%;background:var(--screen);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:640px) and (min-height:720px){
  .device{width:400px;height:min(860px,calc(100% - 48px));border-radius:52px;border:9px solid var(--frame);box-shadow:0 40px 90px rgba(0,0,0,.28)}
}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
.view{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-left:var(--g);padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:16px 120px}
.scroll.flush-bottom{padding-bottom:0}

/* type */
.duo{font-family:var(--display);font-weight:700;font-size:36px;line-height:.98;letter-spacing:-.025em;margin:0}
.duo span{display:block}
.duo span+span{color:var(--ink-2)}
.light-num{font-family:var(--display);font-weight:300;letter-spacing:-.035em;line-height:.95}
.h2{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:-.01em;margin:0}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:11.5px}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ic{flex:none;display:block}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:28px 0 12px}
.link{font-weight:600;font-size:13.5px;color:var(--lime-text)}

/* surfaces */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--glass-line);border-radius:28px;box-shadow:var(--shadow)}
.pad{padding:18px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);color:var(--muted);white-space:nowrap}
.pill.lime{background:var(--lime);border-color:transparent;color:var(--lime-ink)}
.pill.dark{background:var(--ink);border-color:transparent;color:var(--screen)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;vertical-align:1px}

/* orb artwork (replaces food photos) */
.orb{position:relative;overflow:hidden;background:
  radial-gradient(circle at var(--x1) var(--y1), hsl(var(--oh) 78% 63% / .95) 0, hsl(var(--oh) 70% 40% / .5) calc(var(--sz) * .55), transparent var(--sz)),
  radial-gradient(circle at var(--x2) var(--y2), hsl(calc(var(--oh) + 18) 55% 72% / .45) 0, transparent 38%),
  radial-gradient(130% 100% at 50% 110%, hsl(var(--oh) 45% 17%) 0, #0D0E0D 72%)}
.orb.mini{width:52px;height:52px;border-radius:16px;flex:none}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border-radius:999px;font-weight:600;font-size:15px;background:var(--glass);border:1px solid var(--glass-line)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--screen)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.btn.block{width:100%}
.btn .knob{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--screen) 16%,transparent);margin-right:-14px}
.circle{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--glass-line);flex:none}
.circle.sm{width:36px;height:36px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;margin:0 calc(-1 * var(--g));padding:2px var(--g);scrollbar-width:none}
.chips.scrollx::-webkit-scrollbar{display:none}
.chip{min-height:40px;padding:0 16px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);font-weight:500;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--screen)}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:24px;text-align:left;background:var(--glass);border:1px solid var(--glass-line)}
.opt.on{background:var(--ink);border-color:var(--ink);color:var(--screen)}
.opt .oi{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--raised);flex:none}
.opt.on .oi{background:var(--lime);color:var(--lime-ink)}
.opt b{display:block;font-size:15.5px;font-weight:600}
.opt .sub{font-size:13px;opacity:.65}
.seg{display:flex;background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;min-height:40px;padding:0 8px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--screen)}
.field{display:flex;flex-direction:column;gap:7px}
.field>label,.field>.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:52px;padding:0 18px;border-radius:18px;border:1px solid var(--glass-line);background:var(--glass)}
.inp:focus{outline:none;border-color:var(--ink)}
textarea.inp{min-height:88px;padding:14px 18px;resize:vertical}
select.inp{appearance:none}
.unit{position:relative}
.unit span{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=range]{width:100%;accent-color:var(--ink)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:50%;background:var(--raised);font-size:20px;font-weight:500}

/* top header pill (inspired by "Dashboard" bar) */
.appbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 16px;border-radius:999px;margin-bottom:22px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.02em}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--screen);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px}

/* onboarding */
.ob-top{display:flex;align-items:center;gap:14px;padding:14px var(--g) 4px}
.prog{flex:1;display:flex;gap:5px}
.prog i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.prog i.on{background:var(--ink)}
.ob-foot{padding:12px var(--g) calc(16px + env(safe-area-inset-bottom,0px))}
.welcome{position:relative;flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.welcome .logo{justify-content:center;padding-top:18px;position:relative;z-index:2}
.glow{position:absolute;left:50%;top:38%;width:min(150%,560px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 42% 55%,var(--lime) 0,color-mix(in srgb,var(--lime) 55%,transparent) 22%,transparent 48%),
             radial-gradient(circle at 62% 38%,#9FD9B5 0,transparent 30%),
             radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--ink) 10%,transparent) 0,transparent 66%);
  filter:blur(26px);opacity:.95}
.welcome-copy{position:relative;z-index:2;margin-top:auto;padding:0 var(--g) 14px}
.welcome-copy .duo{font-size:42px}
.wpanel{position:relative;z-index:2;margin:0 10px calc(10px + env(safe-area-inset-bottom,0px));padding:12px;border-radius:36px}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{border-radius:24px;padding:12px 14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;background:var(--glass);border:1px solid var(--glass-line)}
.swipe{position:relative;height:64px;border-radius:999px;background:var(--ink);color:var(--screen);display:flex;align-items:center;justify-content:center;margin-top:10px;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden}
.swipe .knob{position:absolute;left:6px;top:6px;width:52px;height:52px;border-radius:50%;background:var(--screen);color:var(--ink);display:grid;place-items:center;will-change:transform;cursor:grab}
.swipe .end{position:absolute;right:20px;width:16px;height:16px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--screen) 55%,transparent)}
.swipe .txt{font-weight:600;font-size:15px;transition:opacity .15s}
.target-num{font-size:72px}
.mac3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mac{padding:14px;border-radius:22px}
.mac b{display:block;font-family:var(--display);font-weight:500;font-size:24px;letter-spacing:-.02em}
.note{font-size:12.5px;color:var(--muted);padding:12px 16px;border-radius:18px;background:var(--glass)}

/* today */
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.daycol{display:grid;grid-template-columns:auto auto;gap:14px 18px}
.dc{display:flex;gap:8px;align-items:flex-start}
.dc b{font-family:var(--display);font-weight:300;font-size:30px;line-height:1;letter-spacing:-.02em;display:block}
.dc span{font-size:11.5px;color:var(--muted)}
.dc.today b{font-weight:600}
.vdots{display:flex;flex-direction:column;gap:3px;padding-top:4px}
.vdots i{width:4px;height:4px;border-radius:50%;background:var(--line)}
.vdots i.t{background:var(--lime-text)}
.vdots i.m{background:var(--ink)}
.kcal{margin-top:18px;padding:20px;display:grid;grid-template-columns:1fr 124px;gap:8px;align-items:center}
.dial{position:relative;width:124px;height:124px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ink) 55%,transparent) 0,color-mix(in srgb,var(--ink) 16%,transparent) 32%,transparent 62%)}
.dial svg{position:absolute;inset:0}
.dial .core{width:22px;height:22px;border-radius:50%;background:var(--raised);border:5px solid var(--ink)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;grid-column:1/-1;margin-top:10px}
.bar{height:4px;border-radius:9px;background:var(--line);overflow:hidden;margin:7px 0 5px}
.bar i{display:block;height:100%;border-radius:9px}

/* night stage */
.night{background:var(--night);color:var(--night-ink);margin:26px calc(-1 * var(--g)) 0;padding:26px var(--g) 130px;border-radius:34px 34px 0 0;position:relative}
.night:before{content:"";position:absolute;left:50%;top:-1px;transform:translateX(-50%);width:84px;height:16px;background:var(--screen);border-radius:0 0 18px 18px}
.night .muted{color:var(--night-muted)}
.night .h2{color:var(--night-ink)}
.night .link{color:var(--lime)}
.ncard{background:var(--night-2);border:1px solid var(--night-line);border-radius:28px;padding:18px}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1 * var(--g));padding:4px var(--g) 6px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.mcard{scroll-snap-align:start;flex:none;width:176px;height:228px;border-radius:30px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;color:#F4F6EE;text-align:left;border:1px solid rgba(255,255,255,.06)}
.mcard .t{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.15;letter-spacing:-.01em;text-shadow:0 1px 10px rgba(0,0,0,.35)}
.mcard .s{font-size:12px;opacity:.75}
.go{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);flex:none;color:#fff}
.go.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.mcard.add{background:var(--night-2);border:1.5px dashed var(--night-line);align-items:center;justify-content:center;gap:10px;color:var(--night-muted)}
.tl{position:relative;display:flex;flex-direction:column;gap:16px;padding-left:24px;margin-top:14px}
.tl:before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1.5px;background:var(--night-line)}
.tli{position:relative}
.tli:before{content:"";position:absolute;left:-24px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--night);border:2px solid var(--lime)}
.tli.tr:before{background:var(--lime)}
.tli .when{font-size:12px;font-weight:600;color:var(--lime);font-variant-numeric:tabular-nums}
.tli b{display:block;font-weight:600;font-size:14.5px}
.rlink{margin-top:8px;display:inline-flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:999px;background:rgba(255,255,255,.07);font-size:13px;font-weight:600}
.rlink .orb{width:30px;height:30px;border-radius:50%}
.light .tl:before{background:var(--line)}
.light .tli:before{background:var(--screen);border-color:var(--ink)}
.light .tli.tr:before{background:var(--ink)}
.light .tli .when{color:var(--lime-text)}
.light .rlink{background:var(--raised)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.metric{border-radius:18px;padding:10px 6px;text-align:center;background:var(--glass);border:1px solid var(--glass-line)}
.night .metric{background:var(--night-2);border-color:var(--night-line)}
.metric b{display:block;font-family:var(--display);font-weight:500;font-size:18px}
.metric span{font-size:10.5px;color:var(--muted)}
.night .metric span{color:var(--night-muted)}
.water{display:flex;gap:6px;flex-wrap:wrap}
.water button{width:32px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--night-2);color:var(--night-muted);border:1px solid var(--night-line)}
.water button.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.ptrack{height:8px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.ptrack i{display:block;height:100%;border-radius:9px;background:var(--lime)}
.feed{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--night-line)}
.feed:last-child{border-bottom:0}
.feed .fi{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--lime);flex:none}
.xrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--night-line)}
.xrow:last-child{border-bottom:0}

/* recipes */
.search{position:relative}
.search .ic{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:48px;border-radius:999px}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rcard{position:relative;border-radius:30px;aspect-ratio:.78;max-width:100%;overflow:hidden;color:#F4F6EE;text-align:left;display:block;width:100%}
.rcard .in{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.rcard b{font-family:var(--display);font-weight:600;font-size:16.5px;line-height:1.15;letter-spacing:-.01em;text-shadow:0 1px 12px rgba(0,0,0,.4)}
.rcard .meta{font-size:11.5px;opacity:.78}
.fav{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;z-index:2}
.fav.on{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.fav.on path{fill:currentColor}
.addcard{border-radius:30px;aspect-ratio:.78;max-width:100%;border:1.5px dashed color-mix(in srgb,var(--ink) 22%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-weight:600;padding:16px;text-align:center;width:100%}

/* calendar */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:6px;border-radius:30px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 9px;border-radius:24px;min-height:76px}
.day span{font-size:11px;color:var(--muted);font-weight:600}
.day b{font-family:var(--display);font-weight:500;font-size:19px}
.day.on{background:var(--ink)}
.day.on span{color:color-mix(in srgb,var(--screen) 60%,transparent)}
.day.on b{color:var(--screen)}
.day.today:not(.on) b{color:var(--lime-text);font-weight:700}
.hdots{display:flex;gap:3px;height:5px}
.hdots i{width:5px;height:5px;border-radius:50%;background:var(--lime-text)}
.day.on .hdots i{background:var(--lime)}
.hdots i.m{background:var(--ink-2)}
.trow{display:flex;align-items:center;gap:14px;padding:12px 12px 12px 12px;border-radius:26px}
.trow .ti{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--lime);flex:none}
.slot{display:flex;align-items:center;gap:14px;padding:10px 12px 10px 10px;border-radius:26px;width:100%;text-align:left}
.slot.empty{background:transparent;border:1.5px dashed color-mix(in srgb,var(--ink) 18%,transparent);box-shadow:none}
.slot .ph{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--raised);color:var(--muted);flex:none}
.device-chip{width:48px;height:48px;border-radius:50%;background:var(--raised);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}

/* progress */
.legend{display:flex;gap:14px;align-items:center;font-size:13px;font-weight:500}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.duo-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.ringcard{border-radius:30px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;min-height:170px}
.tickring{position:relative;width:96px;height:96px;margin:6px auto;display:grid;place-items:center}
.tickring svg{position:absolute;inset:0}
.orbcircle{border-radius:50%;aspect-ratio:1;max-width:100%;display:grid;place-items:center;color:#F4F6EE;text-align:center;align-self:center;width:100%}
.mile{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.mile:last-child{border-bottom:0}
.mile .mi{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid color-mix(in srgb,var(--ink) 18%,transparent);color:transparent;flex:none}
.mile.done .mi{background:var(--ink);border-color:var(--ink);color:var(--lime)}

/* floating tab bar */
.tabbar{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:999px;z-index:5;
  background:var(--glass-strong);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--glass-line);box-shadow:0 10px 34px rgba(0,0,0,.14)}
.tab{height:50px;min-width:50px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--raised);color:var(--ink);padding:0 15px;transition:background .25s var(--spring),color .25s var(--spring)}
.tab .tl-txt{display:none;font-weight:600;font-size:14px}
.tab.on{background:var(--ink);color:var(--screen);padding:0 20px}
.tab.on .tl-txt{display:inline}

/* sheets */
.overlay{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:20}
.overlay.anim{animation:fade .3s ease}
.sheet{width:100%;max-height:93%;overflow-y:auto;background:var(--screen);border-radius:36px 36px 0 0;padding:8px var(--g) calc(24px + env(safe-area-inset-bottom,0px))}
.overlay.anim .sheet{animation:up .5s var(--spring)}
.grab{width:38px;height:5px;border-radius:9px;background:color-mix(in srgb,var(--ink) 18%,transparent);margin:0 auto 14px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.rhero{border-radius:32px;height:250px;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;color:#F4F6EE}
.rhero .t{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;letter-spacing:-.02em;text-shadow:0 2px 16px rgba(0,0,0,.4)}
.ing{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:0}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:14px}
.steps li{counter-increment:s;display:flex;gap:14px}
.steps li:before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--lime);font-weight:600;font-size:13px;display:grid;place-items:center}
.why{border-radius:26px;padding:16px 18px;background:var(--ink);color:var(--screen)}
.why li::marker{color:var(--lime)}
.sticky-actions{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));margin:20px calc(-1 * var(--g)) calc(-24px - env(safe-area-inset-bottom,0px));padding:12px var(--g) calc(16px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--screen) 82%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);display:flex;gap:10px}
.listbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.listbtn:last-child{border-bottom:0}
.check{width:30px;height:30px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--ink) 22%,transparent);display:grid;place-items:center;flex:none;color:transparent}
.check.on{background:var(--ink);border-color:var(--ink);color:var(--lime)}
.shop.done .grow{text-decoration:line-through;color:var(--muted)}
.brand-g{width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--screen);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px;flex:none}
.spinner{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink);animation:spin .8s linear infinite;margin:24px auto}
.toast{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--screen);padding:12px 18px;border-radius:999px;font-weight:600;font-size:13.5px;z-index:40;max-width:calc(100% - 40px);text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.2)}
.toast.show{animation:toast .4s var(--spring)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{background:transparent}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toast{from{opacity:0;transform:translate(-50%,12px) scale(.96)}}
.screen-in{animation:sin .45s var(--spring)}
@keyframes sin{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (prefers-reduced-transparency: reduce){.glass,.tabbar,.sticky-actions{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--raised)}}
</style>
</head>

/* ============ State ============ */
const LS = 'fiber-proto-v1';
const DEF = {name:'Lena', goal:'abnehmen', pace:'moderat', sex:'w', age:31, height:172, weight:68, target:64, bf:27, bfUnknown:false,
  activity:'aktiv', days:4, sports:['laufen','kraft'], trainGoal:'Halbmarathon unter 2:00 h', diet:'vegetarisch', allergies:['nuesse'], dislikes:'Koriander'};
const fresh = () => ({onboarded:false, step:0, profile:{...DEF, sports:[...DEF.sports], allergies:[...DEF.allergies]}, tab:'heute',
  log:{}, hist:{}, histP:{}, water:{}, fav:['oats','dal','quinoa'], custom:[], plan:{}, trainings:[], garmin:{connected:false},
  weights:[], startWeight:null, startDate:null, planWeeks:12, selDay:dkey(today()), rmode:'entdecken', rfilter:'alle', q:'', shopDone:{}, sheet:null});
let S;
try { S = JSON.parse(localStorage.getItem(LS)); } catch(e) { S = null; }
if (!S || !S.profile) S = fresh();
S.sheet = null;
function save(){ try { localStorage.setItem(LS, JSON.stringify({...S, sheet:null})); } catch(e) {} }

/* ============ Calculations ============ */
function calc(p = S.profile){
  const s = p.sex==='m' ? 5 : p.sex==='w' ? -161 : -78;
  const bmr = 10*p.weight + 6.25*p.height - 5*p.age + s;
  const af = (ACT.find(a => a[0]===p.activity) || ACT[2])[3];
  const tdee = bmr*af;
  const pf = {sanft:.7, moderat:1, ambitioniert:1.35}[p.pace] || 1;
  const adj = {abnehmen:-450*pf, aufbau:250*pf, zunehmen:350*pf, halten:0, ausdauer:150}[p.goal];
  const kcal = Math.round(Math.max(tdee + adj, bmr) / 10) * 10;
  const pk = {abnehmen:2.0, aufbau:2.0, zunehmen:1.8, halten:1.7, ausdauer:1.6}[p.goal];
  const protein = Math.round(p.weight*pk);
  const fat = Math.round(Math.max(p.weight*0.9, kcal*0.25/9));
  const carbs = Math.max(60, Math.round((kcal - protein*4 - fat*9) / 4));
  const rate = p.goal==='abnehmen' ? 0.5*pf : (p.goal==='aufbau'||p.goal==='zunehmen') ? 0.25*pf : 0;
  const diff = hasTarget(p) ? p.target - p.weight : 0;
  const weeks = rate && Math.abs(diff) > 0.1 ? Math.ceil(Math.abs(diff)/rate) : 0;
  const bmi = p.weight / ((p.height/100)**2);
  const bf = p.bfUnknown ? estBf(p) : p.bf;
  const water = Math.round(p.weight*0.035*4)/4;
  return {bmr, tdee, kcal, protein, fat, carbs, weeks, bmi, bf, water, rate};
}
const hasTarget = p => ['abnehmen','aufbau','zunehmen'].includes(p.goal);
const estBf = p => { const bmi = p.weight/((p.height/100)**2); return clamp(Math.round(1.2*bmi + 0.23*p.age - 10.8*(p.sex==='m'?1:0) - 5.4), 6, 50); };
const burn = t => Math.round(SPORTS[t.type].k * INT[t.int].f * t.dur * (S.profile.weight/70));
const trainingsOn = key => S.trainings.filter(t => t.date===key).sort((a,b) => toMin(a.time)-toMin(b.time));
function dayTarget(key){
  const c = calc(); const b = trainingsOn(key).reduce((s,t) => s+burn(t), 0);
  const bonus = Math.round(b*0.5/10)*10;
  return {kcal:c.kcal+bonus, bonus, protein:c.protein, carbs:c.carbs+Math.round(bonus/4), fat:c.fat};
}
const allRecipes = () => [...S.custom, ...RECIPES];
const getR = id => allRecipes().find(r => r.id===id);
function fits(r, p = S.profile){
  if (r.custom) return true;
  if (!DIET_OK[p.diet].includes(r.diet)) return false;
  if (p.diet==='lowcarb' && r.c > 30) return false;
  return !r.al.some(a => p.allergies.includes(a));
}
const isHP = r => r.p*4/r.kcal >= .28;
const isLC = r => r.c <= 25;
function suggest(slot, key){
  let pool = allRecipes().filter(r => !r.custom && fits(r) && r.meals.includes(slot));
  const tr = trainingsOn(key);
  const pick = tag => { const x = pool.filter(r => r.tags.includes(tag)); if (x.length) pool = x; };
  if (slot==='snack' && tr.some(t => toMin(t.time) >= 12*60)) pick('pre');
  if (slot==='abend' && tr.some(t => toMin(t.time) >= 15*60)) pick('post');
  if (slot==='fruehstueck' && tr.some(t => toMin(t.time) < 10*60)) pick('post');
  if (!pool.length) pool = allRecipes().filter(r => fits(r));
  if (!pool.length) return null;
  return pool[hashStr(key+slot) % pool.length];
}
function planned(key, slot){
  const v = S.plan[key]?.[slot];
  if (v === '') return null;
  if (v) return getR(v) || null;
  return suggest(slot, key);
}
const isUserPlanned = (key, slot) => !!S.plan[key]?.[slot];
const logOf = key => S.log[key] || [];
const sumLog = key => logOf(key).reduce((a,e) => ({kcal:a.kcal+e.kcal, p:a.p+e.p, c:a.c+e.c, f:a.f+e.f}), {kcal:0,p:0,c:0,f:0});
function logRecipe(r, slot, key, serv = 1){
  (S.log[key] ||= []).push({id:uid(), rid:r.id, slot, name:r.n, kcal:Math.round(r.kcal*serv), p:Math.round(r.p*serv), c:Math.round(r.c*serv), f:Math.round(r.f*serv)});
}
const eatenEntry = (key, slot, rid) => logOf(key).find(e => e.slot===slot && e.rid===rid);
const pickTagged = (tag, seed) => { const pool = RECIPES.filter(r => fits(r) && r.tags.includes(tag)); return pool.length ? pool[hashStr(seed) % pool.length] : null; };

function tipsFor(t){
  const w = S.profile.weight, sp = SPORTS[t.type], start = toMin(t.time), end = start + t.dur;
  const hard = t.int !== 'locker', long = t.dur >= 75, out = [];
  if (t.type === 'yoga'){
    out.push({at:start-120, title:'Leicht essen', text:'Letzte grössere Mahlzeit etwa 2 Stunden vorher, danach nur Wasser oder Tee.'});
    out.push({at:end+30, title:'Danach', text:'Normale Mahlzeit mit Protein und Gemüse. Kein spezieller Recovery-Bedarf.'});
    return out;
  }
  const gpk = long ? 1.5 : 1;
  if (start >= 9*60) out.push({at:start-180, title:'Mahlzeit vor dem Training', text:`ca. ${Math.round(w*gpk/5)*5} g Kohlenhydrate (${gpk} g/kg), etwas Protein, wenig Fett und Ballaststoffe – z. B. Reis, Pasta oder Brot.`});
  else out.push({at:start-45, title:'Frühes Training', text: hard ? 'Kleiner Snack mit 20–30 g schnellen Kohlenhydraten, z. B. eine Banane oder Toast mit Honig.' : 'Bei lockerer Einheit ist nüchtern okay. Ein Glas Wasser reicht.', rid: hard ? pickTagged('pre', t.id)?.id : null});
  if (hard && start >= 9*60) out.push({at:start-45, title:'Snack 30–60 Min. vorher', text:'20–30 g leicht verdauliche Kohlenhydrate für volle Speicher.', rid:pickTagged('pre', t.id)?.id});
  if (long && sp.endu) out.push({at:start+30, title:'Während der Einheit', text:`${t.dur >= 120 ? '60' : '30–60'} g Kohlenhydrate und 500–750 ml Flüssigkeit pro Stunde.`});
  const post = {at:end+20, title:'Recovery innerhalb 60 Min.', text:`${Math.round(w*0.3)} g Protein${sp.endu || t.type==='hiit' ? ` + ${Math.round(w*(long?1.2:0.8))} g Kohlenhydrate` : ''} für Reparatur und Glykogen.`, rid:pickTagged('post', t.id+'p')?.id};
  out.push(post);
  if (t.type === 'kraft') out.push({at:null, title:'Protein über den Tag verteilen', text:`Dein Ziel von ${calc().protein} g auf 4 Mahlzeiten à ~${Math.round(calc().protein/4)} g verteilen – so nutzt dein Körper es am besten.`});
  if (S.garmin.connected && sp.endu && hard) out.push({at:null, title:'Flüssigkeit (Garmin)', text:`Geschätzter Schweissverlust: ~${fmt(t.dur*11)} ml. Danach ca. ${fmt(t.dur*11*1.5)} ml trinken.`});
  return out;
}

/* ============ Demo seed (after onboarding) ============ */
function seedDemo(){
  const t = today(), p = S.profile, c = calc();
  S.trainings = S.trainings.filter(x => x.src === 'garmin');
  const sp = p.sports.length ? p.sports : ['laufen','kraft'];
  const endu = sp.find(s => SPORTS[s].endu);
  const add = (off, time, type, dur, int) => S.trainings.push({id:uid(), date:dkey(addDays(t,off)), time, type, name:SPORTS[type].demo, dur, int, src:'manuell'});
  add(0, '18:00', sp[0], 45, 'intensiv');
  add(1, '07:00', sp[1 % sp.length], 60, 'mittel');
  add(3, '12:15', sp.includes('yoga') ? 'yoga' : sp[2 % sp.length], 45, 'locker');
  if (endu) add(5, '09:00', endu, endu==='laufen' ? 100 : endu==='rad' ? 150 : 60, 'mittel');
  add(-2, '18:30', sp[1 % sp.length], 55, 'mittel');
  const dir = p.goal==='abnehmen' ? 1 : (p.goal==='aufbau' || p.goal==='zunehmen') ? -1 : 0;
  const start = +(p.weight + dir*2.4).toFixed(1);
  S.startWeight = start; S.startDate = dkey(addDays(t, -42)); S.planWeeks = 6 + (c.weeks || 8);
  const noise = [0, .3, -.1, .25, -.2, .1, 0];
  S.weights = Array.from({length:7}, (_, i) => ({d:dkey(addDays(t, -42 + i*7)), kg:+(start + (p.weight - start)*(i/6) + (dir ? noise[i] : noise[i]*1.4)).toFixed(1)}));
  S.hist = {}; S.histP = {};
  [-120, 90, -60, 140, -210, 40].forEach((o, i) => { const k = dkey(addDays(t, i-6)); S.hist[k] = c.kcal + o; S.histP[k] = c.protein + [-8, 6, 3, -22, 4, 9][i]; });
  S.log = {}; S.plan = {}; S.water = {[dkey(t)]:3}; S.selDay = dkey(t);
  const br = suggest('fruehstueck', dkey(t)); if (br) logRecipe(br, 'fruehstueck', dkey(t));
}

}
const macroBar = (label, val, goal, color) => `<div><div class="xs muted">${label}</div><div class="bar"><i style="width:${clamp(val/goal*100,0,100)}%;background:${color}"></i></div><div class="xs num"><b>${val}</b><span class="muted"> / ${goal} g</span></div></div>`;
function dial(frac){
  const f = clamp(frac, 0, 1), a = -Math.PI/2 + f*2*Math.PI, r = 50, cx = 62, cy = 62;
  return `<svg viewBox="0 0 124 124" aria-hidden="true"><circle cx="62" cy="62" r="${r}" fill="none" stroke="var(--ink-2)" stroke-width="1.2" stroke-dasharray="3 5"/>
    <circle cx="62" cy="62" r="${r}" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="${2*Math.PI*r*f} 999" transform="rotate(-90 62 62)"/>
    <line x1="62" y1="62" x2="${cx + Math.cos(a)*r}" y2="${cy + Math.sin(a)*r}" stroke="var(--ink)" stroke-width="1.2" opacity=".5"/>
    <circle cx="${cx + Math.cos(a)*r}" cy="${cy + Math.sin(a)*r}" r="5" fill="var(--raised)" stroke="var(--ink)" stroke-width="2.4"/></svg><span class="core"></span>`;
}
function sparkline(vals, w = 150, h = 46){
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = (mx - mn) || 1;
  const pts = vals.map((v, i) => [4 + i*(w-12)/(vals.length-1), h - 6 - (v - mn)/rg*(h-14)]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++){ const [x0,y0] = pts[i-1], [x1,y1] = pts[i], mx2 = (x0+x1)/2; d += ` C${mx2},${y0} ${mx2},${y1} ${x1},${y1}`; }
  const [lx, ly] = pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="max-width:100%"><path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/><circle cx="${lx}" cy="${ly}" r="4.5" fill="var(--raised)" stroke="var(--ink)" stroke-width="2"/></svg>`;
}

function trainingHint(key, slot){
  const tr = trainingsOn(key); if (!tr.length) return '';
  if (slot==='snack' && tr.some(t => toMin(t.time) >= 12*60)) return ' · Pre-Workout';
  if (slot==='abend' && tr.some(t => toMin(t.time) >= 15*60)) return ' · Recovery';
  if (slot==='fruehstueck' && tr.some(t => toMin(t.time) < 10*60)) return ' · Recovery';
  return '';
}
const garminMetrics = () => [['52','Ruhepuls'],['7:20','Schlaf'],['68','Body Battery'],[fmt(8432),'Schritte']].map(([v,l]) => `<div class="metric"><b class="num">${v}</b><span>${l}</span></div>`).join('');

function viewCalendar(){

/* --- progress --- */
function viewProgress(){
  const p = S.profile, c = calc(), w = S.weights, cur = w.length ? w[w.length-1].kg : p.weight;
  const start = S.startWeight ?? cur, delta = cur - start, t = today();
  const days = Array.from({length:7}, (_, i) => dkey(addDays(t, i-6)));
  const kc = days.map(k => k===dkey(t) ? sumLog(k).kcal : (S.hist[k] ?? 0));
  const pr = days.map(k => k===dkey(t) ? sumLog(k).p : (S.histP[k] ?? 0));
  const pHit = Object.values(S.histP).filter(v => v >= c.protein).length;
  const bfNow = c.bf, bfStart = +(bfNow + (p.goal==='abnehmen' ? 1.6 : p.goal==='aufbau' ? 0.4 : 0.2)).toFixed(1);
  const lost = Math.abs(delta);
  const miles = hasTarget(p) ? [['Plan gestartet', true], ['Erste Woche durchgezogen', true], [`${p.goal==='abnehmen'?'−':'+'}2 kg erreicht`, lost >= 2], ['Halbzeit', lost >= Math.abs(start - p.target)/2], [`Zielgewicht ${p.target} kg`, Math.abs(cur - p.target) < .2]]
    : [['Plan gestartet', true], ['Erste Woche durchgezogen', true], ['4 Wochen konstant ±1 kg', true], ['12 Wochen dabei', false]];
  return `<div class="screen-in">
  <div class="between" style="align-items:flex-start;margin-bottom:6px">${duo('Dein', 'Fortschritt')}<span class="pill">Demo-Verlauf</span></div>
  <div class="glass pad chart" style="margin-top:16px">
    <div class="between"><div class="legend"><span><i class="dot" style="background:var(--ink)"></i> Gewicht</span>${hasTarget(p) ? `<span><i class="dot" style="background:var(--lime-text)"></i> Ziel</span>` : ''}</div><span class="small"><span class="muted">Aktuell</span> <b class="num">${cur.toFixed(1)} kg</b></span></div>
    <div style="margin-top:10px">${weightChart(w, hasTarget(p) ? p.target : null)}</div>
    <div class="between small" style="margin-top:6px"><span class="muted">Start <b class="num" style="color:var(--ink)">${start.toFixed(1)} kg</b></span><span class="muted">Veränderung <b class="num" style="color:var(--ink)">${delta>0?'+':delta<0?'−':'±'}${Math.abs(delta).toFixed(1)} kg</b></span></div>
    <form class="row" style="margin-top:14px" data-form="weigh"><div class="unit grow"><input id="f-weigh" class="inp num" type="number" step="0.1" inputmode="decimal" placeholder="Gewicht heute" aria-label="Gewicht heute"><span>kg</span></div><button type="submit" class="btn ink press">Eintragen</button></form>
  </div>

  <div class="glass pad chart" style="margin-top:12px">
    <div class="between"><div class="legend"><span><i class="dot" style="background:var(--ink-2)"></i> Kalorien</span><span><i class="dot" style="background:var(--lime-text)"></i> Protein</span></div><span class="xs muted num">Ziel ${fmt(c.kcal)}</span></div>
    <div style="margin-top:8px">${capsuleChart(days, kc, pr, c.kcal, c.protein)}</div>
    <div class="between xs muted num"><span>min. ${fmt(Math.min(...kc.filter(Boolean)))} kcal</span><span>max. ${fmt(Math.max(...kc))} kcal</span></div>
  </div>

  <div class="duo-cards">
    <div class="ringcard glass"><div class="between"><span class="label">Protein</span><span class="xs muted">6 Tage</span></div>
      <div class="tickring">${tickRing(pHit/6)}<span class="light-num num" style="font-size:30px">${pHit}<span style="font-size:15px">/6</span></span></div>
      <span class="xs muted">Ziel ${c.protein} g erreicht</span></div>
    <div class="ringcard glass" style="padding:10px"><div class="orbcircle orb" style="${orbVars('bf', 4)}"><div><div class="light-num num" style="font-size:30px">${bfNow}<span style="font-size:15px">%</span></div><div class="xs" style="opacity:.8">Körperfett</div><div class="xs" style="opacity:.65">Start ${bfStart} %</div></div></div></div>
  </div>

  <div class="sec-h"><h2 class="h2">Meilensteine</h2></div>
  <div class="glass" style="padding:4px 18px">${miles.map(([l,d]) => `<div class="mile ${d?'done':''}"><span class="mi">${ic('check',15,2.6)}</span><span class="${d?'':'muted'}" style="font-weight:${d?600:500}">${l}</span></div>`).join('')}</div>
  </div>`;
}
function tickRing(f){
  let s = '<svg viewBox="0 0 96 96" aria-hidden="true">';
  for (let i = 0; i < 48; i++){ const a = -Math.PI/2 + i/48*2*Math.PI, on = i/48 < f; const r1 = 40, r2 = on ? 47 : 44;
    s += `<line x1="${48+Math.cos(a)*r1}" y1="${48+Math.sin(a)*r1}" x2="${48+Math.cos(a)*r2}" y2="${48+Math.sin(a)*r2}" stroke="${on?'var(--ink)':'var(--ink-2)'}" stroke-width="${on?2:1}" stroke-linecap="round" opacity="${on?1:.5}"/>`; }
  return s + '</svg>';
}
function weightChart(w, target){
  if (!w.length) return '<p class="muted">Noch keine Daten.</p>';
  const W = 320, H = 160, L = 28, R = 10, T = 14, B = 22;
  const vals = w.map(x => x.kg).concat(target != null ? [target] : []);
  const mn = Math.floor(Math.min(...vals) - .5), mx = Math.ceil(Math.max(...vals) + .5);
  const x = i => L + (w.length === 1 ? 0 : i*(W-L-R)/(w.length-1)), y = v => T + (mx - v)*(H-T-B)/(mx-mn);
  const step = Math.max(1, Math.round((mx-mn)/4));
  let grid = ''; for (let v = mn; v <= mx; v += step) grid += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  let d = `M${x(0)},${y(w[0].kg)}`;
  for (let i = 1; i < w.length; i++){ const mxp = (x(i-1)+x(i))/2; d += ` C${mxp},${y(w[i-1].kg)} ${mxp},${y(w[i].kg)} ${x(i)},${y(w[i].kg)}`; }
  const last = w[w.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsverlauf">${grid}
    ${target != null ? `<line x1="${L}" x2="${W-R}" y1="${y(target)}" y2="${y(target)}" stroke="var(--lime-text)" stroke-dasharray="3 5" stroke-width="1.5"/>` : ''}
    <path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
    ${w.map((p,i) => `<circle cx="${x(i)}" cy="${y(p.kg)}" r="${i===w.length-1?5:2.5}" fill="${i===w.length-1?'var(--raised)':'var(--ink)'}" stroke="var(--ink)" stroke-width="${i===w.length-1?2.2:0}"/>`).join('')}
    ${w.map((p,i) => (i % 2 === 0 || i === w.length-1) ? `<text x="${x(i)}" y="${H-5}" text-anchor="middle">${parseKey(p.d).getDate()}.${parseKey(p.d).getMonth()+1}.</text>` : '').join('')}
  </svg>`;
}
function capsuleChart(days, kc, pr, target, ptarget){
  const W = 320, H = 150, T = 10, B = 22, mx = Math.max(target*1.25, ...kc), bw = W/7;
  const y = v => T + (1 - v/mx)*(H-T-B);
  let ticks = ''; for (let i = 0; i < 56; i++) ticks += `<line x1="${4 + i*(W-8)/55}" x2="${4 + i*(W-8)/55}" y1="${T}" y2="${T+5}" stroke="var(--ink-2)" opacity=".4"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kalorien und Protein der letzten 7 Tage">${ticks}
    <line x1="0" x2="${W}" y1="${y(target)}" y2="${y(target)}" stroke="var(--ink-2)" stroke-dasharray="3 5"/>
    ${kc.map((v,i) => { const cx = i*bw + bw/2, isT = i===6, ph = clamp(pr[i]/ptarget,0,1.2)*(H-T-B)*.35;
      return `<line x1="${cx-5}" x2="${cx-5}" y1="${H-B}" y2="${Math.min(H-B-4, y(v))}" stroke="${isT?'var(--ink)':'var(--ink-2)'}" stroke-width="6" stroke-linecap="round"/>
      <line x1="${cx+5}" x2="${cx+5}" y1="${H-B}" y2="${H-B-Math.max(4,ph)}" stroke="var(--lime-text)" stroke-width="6" stroke-linecap="round"/>
      <text x="${cx}" y="${H-5}" text-anchor="middle" style="${isT?'fill:var(--ink);font-weight:700':''}">${isT?'Heute':WD[parseKey(days[i]).getDay()]}</text>`; }).join('')}
  </svg>`;
}

    const p = S.profile, c = calc();
    inner = `${head(esc(p.name), 'Profil')}
      <div class="glass" style="padding:4px 18px">${[['Ziel', GOALS.find(g=>g.id===p.goal).t], ['Körper', `${p.height} cm · ${p.weight} kg · ${c.bf} % KF`], ['Kalorien', `${fmt(c.kcal)} kcal`], ['Makros P / K / F', `${c.protein} / ${c.carbs} / ${c.fat} g`], ['Ernährung', DIETS.find(d=>d[0]===p.diet)[1]], ['Ohne', p.allergies.map(a => ALLERG.find(x=>x[0]===a)[1]).join(', ') || '–'], ['Mag nicht', esc(p.dislikes) || '–'], ['Trainingsziel', esc(p.trainGoal) || '–'], ['Garmin', S.garmin.connected ? 'Verbunden' : 'Nicht verbunden']]
        .map(([k,v]) => `<div class="ing small"><span class="muted">${k}</span><b class="num" style="font-weight:600;text-align:right">${v}</b></div>`).join('')}</div>
      <div class="stack" style="margin-top:16px;gap:8px">
        <button type="button" class="btn ink block press" data-a="reOnboard">Ziele & Daten anpassen</button>
        ${S.garmin.connected ? `<button type="button" class="btn block press" data-a="gdisconnect">Garmin trennen</button>` : ''}
        <button type="button" class="btn block press" data-a="reset">Prototyp zurücksetzen</button>
      </div>`;
  }
  if (sh.type === 'garmin'){
    if (sh.phase === 'consent') inner = `${head('Garmin Connect', 'Verbindung')}
      <div class="row" style="justify-content:center;gap:16px;margin:6px 0 18px"><span class="brand-g" style="background:var(--lime);color:var(--lime-ink)">${LOGO}</span>${ic('link',22)}<span class="brand-g">G</span></div>
      <p class="muted" style="text-align:center">Fiber möchte auf folgende Daten zugreifen</p>
      <div class="glass" style="padding:4px 18px;margin-top:14px">${[['Aktivitäten','Typ, Dauer, Distanz, Kalorien'],['Herzfrequenz','Ruhepuls und Trainingszonen'],['Schlaf & Body Battery','Für Regenerations-Tipps'],['Schritte','Für deinen Tagesumsatz']].map(([a,b]) => `<div class="listbtn"><span class="check on">${ic('check',14,2.6)}</span><span class="grow"><b style="font-weight:600">${a}</b><br><span class="xs muted">${b}</span></span></div>`).join('')}</div>
      <p class="xs muted" style="margin-top:12px">Simuliert im Prototyp. Es werden keine echten Daten abgerufen.</p>
      <div class="stack" style="margin-top:16px;gap:8px"><button type="button" class="btn ink block press" data-a="gallow">Zulassen</button><button type="button" class="btn block press" data-a="close">Abbrechen</button></div>`;
    else inner = `${head('Garmin Connect', 'Verbindung')}<div class="spinner" role="status" aria-label="Synchronisiere"></div><p style="text-align:center"><b>Synchronisiere Aktivitäten</b></p><p class="small muted" style="text-align:center">Die letzten 14 Tage werden importiert</p>`;
  }
  if (sh.type === 'addTraining'){
    const d = sh.draft, mon = mondayOf(parseKey(S.selDay));
    inner = `${head('Training hinzufügen')}
      <form class="stack" data-form="training" style="gap:16px">
        <div class="field"><span class="lbl">Sportart</span><div class="chips">${Object.entries(SPORTS).map(([k,s]) => `<button type="button" class="chip ${d.type===k?'on':''}" data-a="dType" data-v="${k}">${s.t}</button>`).join('')}</div></div>
        <div class="field"><label for="t-n">Bezeichnung</label><input id="t-n" class="inp" data-d="name" value="${esc(d.name)}"></div>
        <div class="field"><span class="lbl">Tag</span><div class="chips">${Array.from({length:7}, (_, i) => { const x = addDays(mon, i), k = dkey(x); return `<button type="button" class="chip ${d.date===k?'on':''}" data-a="dDate" data-v="${k}">${WD[x.getDay()]} ${x.getDate()}.</button>`; }).join('')}</div></div>
        <div class="grid2"><div class="field"><label for="t-t">Uhrzeit</label><input id="t-t" class="inp num" type="time" data-d="time" value="${d.time}"></div>
          <div class="field"><label for="t-d">Dauer</label><div class="unit"><input id="t-d" class="inp num" type="number" inputmode="numeric" data-d="dur" value="${d.dur}"><span>Min.</span></div></div></div>
        <div class="field"><span class="lbl">Intensität</span><div class="seg">${Object.entries(INT).map(([k,v]) => `<button type="button" class="${d.int===k?'on':''}" data-a="dInt" data-v="${k}">${v.t}</button>`).join('')}</div></div>
        <button type="submit" class="btn ink block press">Speichern</button>
      </form>`;
  }
  if (sh.type === 'own'){
    inner = `${head('Eigenes Rezept', 'Sammlung')}
      <form class="stack" data-form="own" style="gap:16px">
        <div class="field"><label for="o-n">Name</label><input id="o-n" class="inp" required placeholder="z. B. Omas Gemüsesuppe"></div>
        <div class="field"><label for="o-m">Mahlzeit</label><select id="o-m" class="inp">${MEALS.map(([s,l]) => `<option value="${s}">${l}</option>`).join('')}</select></div>
        <div class="grid2">
          <div class="field"><label for="o-k">Kalorien</label><div class="unit"><input id="o-k" class="inp num" type="number" required inputmode="numeric"><span>kcal</span></div></div>
          <div class="field"><label for="o-t">Zeit</label><div class="unit"><input id="o-t" class="inp num" type="number" inputmode="numeric" value="20"><span>Min.</span></div></div>
          <div class="field"><label for="o-p">Protein</label><div class="unit"><input id="o-p" class="inp num" type="number" inputmode="numeric" value="0"><span>g</span></div></div>
          <div class="field"><label for="o-c">Kohlenh.</label><div class="unit"><input id="o-c" class="inp num" type="number" inputmode="numeric" value="0"><span>g</span></div></div>
        </div>
        <div class="field"><label for="o-i">Zutaten, eine pro Zeile</label><textarea id="o-i" class="inp" placeholder="200 g Rüebli&#10;1 Zwiebel"></textarea></div>
        <div class="field"><label for="o-s">Zubereitung, ein Schritt pro Zeile</label><textarea id="o-s" class="inp"></textarea></div>
        <button type="submit" class="btn ink block press">Zur Sammlung hinzufügen</button>
      </form>`;
  }
  if (sh.type === 'shop'){
    const mon = mondayOf(parseKey(S.selDay)), agg = {};
    for (let i = 0; i < 7; i++){ const k = dkey(addDays(mon, i)); MEALS.forEach(([s]) => { const r = planned(k, s); if (!r) return; r.ing.forEach(([q,u,n]) => { const id = n+'|'+u; (agg[id] ||= {n, u, q:0}).q += q; }); }); }
    const items = Object.entries(agg).sort((a,b) => a[1].n.localeCompare(b[1].n, 'de'));
    const done = items.filter(([id]) => S.shopDone[id]).length;
    inner = `${head('Einkaufsliste', `${mon.getDate()}.${mon.getMonth()+1}. – ${addDays(mon,6).getDate()}.${addDays(mon,6).getMonth()+1}. · ${done} von ${items.length} erledigt`)}
      <p class="small muted" style="margin-bottom:10px">Aus deinem Essensplan dieser Woche, 1 Portion pro Mahlzeit.</p>
      <div class="glass" style="padding:4px 18px">${items.map(([id, x]) => `<button type="button" class="listbtn shop ${S.shopDone[id]?'done':''}" data-a="shopTog" data-v="${esc(id)}"><span class="check ${S.shopDone[id]?'on':''}">${ic('check',14,2.6)}</span><span class="grow">${esc(x.n)}</span><b class="num" style="font-weight:600">${x.q ? (Math.round(x.q*10)/10).toLocaleString('de-CH') + ' ' + esc(x.u) : esc(x.u)}</b></button>`).join('') || '<p class="muted" style="padding:12px 0">Noch nichts geplant.</p>'}</div>`;
  }
  return `<div class="${S._sheetNew ? 'overlay anim' : 'overlay'}" data-a="close"><div class="sheet" data-a="noop" role="dialog" aria-modal="true">${inner}</div></div>`;
}

/* ============ Render ============ */
let lastView = '';
function render(){
  const viewId = S.onboarded ? 'tab:' + S.tab : 'ob:' + S.step;
  const sc = document.querySelector('.scroll'), st = sc ? sc.scrollTop : 0;
  const car = document.querySelector('.carousel'), cst = car ? car.scrollLeft : 0;
  const sh = document.querySelector('.sheet'), sst = sh ? sh.scrollTop : 0, hadSheet = !!sh;
  $('#app').innerHTML = (S.onboarded ? appView() : onboardingView()) + sheetView();
  const same = viewId === lastView;
  if (same){
    const sc2 = document.querySelector('.scroll'); if (sc2) sc2.scrollTop = st;
    const car2 = document.querySelector('.carousel'); if (car2) car2.scrollLeft = cst;
    document.querySelectorAll('.screen-in').forEach(el => el.classList.remove('screen-in'));
  }
  const sh2 = document.querySelector('.sheet'); if (sh2 && hadSheet && !S._sheetNew) sh2.scrollTop = sst;
  lastView = viewId; S._sheetNew = false;
  if (!S.onboarded && S.step === 0) attachSwipe();
  save();
}
function openSheet(obj){ S.sheet = obj; S._sheetNew = true; render(); }
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.hidden = false; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2300);
}

/* Swipe-to-start: 1:1 tracking with grab offset, velocity projection, rubber band, spring back */
function attachSwipe(){
  const track = $('#swipe'), knob = $('#knob'), txt = $('#swipeTxt'); if (!track) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let x = 0, max = 0, grab = 0, dragging = false, hist = [], raf = 0, moved = false;
  const setX = v => { x = v; knob.style.transform = `translateX(${v}px)`; txt.style.opacity = String(clamp(1 - v/(max*0.6), 0, 1)); };
  const rubber = (o, dim) => (o*dim*0.55)/(dim + 0.55*Math.abs(o));
  const spring = (to, v0, done) => {
    cancelAnimationFrame(raf);
    if (reduce){ setX(to); done && done(); return; }
    let pos = x, vel = v0; const k = 380, c = 2*Math.sqrt(k)*0.9; let last = performance.now();
    const step = now => { const dt = Math.min(.032, (now - last)/1000); last = now;
      const a = -k*(pos - to) - c*vel; vel += a*dt; pos += vel*dt; setX(pos);
      if (Math.abs(pos - to) < .4 && Math.abs(vel) < 8){ setX(to); done && done(); return; }
      raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
  };
  const finish = () => spring(max, 0, () => A.obNext());
  knob.addEventListener('pointerdown', e => {
    cancelAnimationFrame(raf); dragging = true; moved = false; max = track.clientWidth - knob.offsetWidth - 12;
    knob.setPointerCapture(e.pointerId); grab = e.clientX - x; hist = [[e.clientX, e.timeStamp]];
  });
  knob.addEventListener('pointermove', e => {
    if (!dragging) return; let v = e.clientX - grab; if (Math.abs(v) > 3) moved = true;
    if (v < 0) v = -rubber(-v, 60); if (v > max) v = max + rubber(v - max, 60);
    setX(v); hist.push([e.clientX, e.timeStamp]); if (hist.length > 5) hist.shift();
  });
  const up = e => {
    if (!dragging) return; dragging = false;
    const [a, b] = [hist[0], hist[hist.length-1]]; const vel = b && a && b[1] !== a[1] ? (b[0]-a[0])/((b[1]-a[1])/1000) : 0;
    if (!moved){ finish(); return; }
    const projected = x + (vel/1000)*0.99/(1-0.99);
    projected > max*0.6 ? spring(max, vel, () => A.obNext()) : spring(0, vel);
  };
  knob.addEventListener('pointerup', up); knob.addEventListener('pointercancel', up);
  track.addEventListener('click', e => { if (e.target.closest('#knob')) return; max = track.clientWidth - knob.offsetWidth - 12; finish(); });
  track.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); max = track.clientWidth - knob.offsetWidth - 12; finish(); } });
}

/* ============ Actions ============ */
const A = {
  noop(){},
  close(){ S.sheet = null; render(); },
  obNext(){
    const st = STEPS[S.step], p = S.profile;
    if (st === 'koerper'){
      p.age = clamp(Math.round(p.age) || 30, 14, 99); p.height = clamp(Math.round(p.height) || 170, 120, 230);
      p.weight = clamp(+p.weight || 70, 35, 250); p.target = clamp(+p.target || p.weight, 35, 250);
      if (p.goal === 'abnehmen' && p.target >= p.weight) p.target = +(p.weight - 4).toFixed(1);
      if ((p.goal === 'aufbau' || p.goal === 'zunehmen') && p.target <= p.weight) p.target = +(p.weight + 3).toFixed(1);
    }
    if (st === 'training' && !p.sports.length){ toast('Wähle mindestens eine Sportart'); return; }
    if (S.step < STEPS.length - 1){ S.step++; render(); return; }
    seedDemo(); S.onboarded = true; S.tab = 'heute'; render(); toast('Dein Plan ist bereit');
  },
  obBack(){ if (S.step > 0){ S.step--; render(); } },
  set(d){ S.profile[d.k] = d.v; render(); },
  flag(d){ S.profile[d.k] = !S.profile[d.k]; render(); },
  tog(d){ const arr = S.profile[d.k], i = arr.indexOf(d.v); i >= 0 ? arr.splice(i, 1) : arr.push(d.v); render(); },
  days(d){ S.profile.days = clamp(S.profile.days + Number(d.v), 0, 7); render(); },
  tab(d){ S.tab = d.v; S.sheet = null; render(); },
  gocal(d){ S.tab = 'kalender'; S.selDay = d.v; render(); },
  sheet(d){ const o = {type:d.v}; if (d.v === 'quick') o.slot = MEALS[Math.min(3, Math.floor(Math.max(0, new Date().getHours() - 6)/4))][0]; openSheet(o); },
  recipe(d){ openSheet({type:'recipe', id:d.v, serv:1}); },
  serv(d){ S.sheet.serv = clamp((S.sheet.serv || 1) + Number(d.v), 1, 6); render(); },
  fav(d){ const i = S.fav.indexOf(d.v); if (i >= 0){ S.fav.splice(i, 1); toast('Aus Sammlung entfernt'); } else { S.fav.push(d.v); toast('Zur Sammlung hinzugefügt'); } render(); },
  eat(d){
    const r = planned(d.k, d.v); if (!r) return;
    const e = eatenEntry(d.k, d.v, r.id);
    if (e) S.log[d.k] = logOf(d.k).filter(x => x !== e); else { logRecipe(r, d.v, d.k); toast(`${r.kcal} kcal erfasst`); }
    render();
  },
  eatRecipe(d){
    const r = getR(d.v), sv = S.sheet?.serv || 1, key = dkey(today());
    const slot = MEALS.find(([s]) => planned(key, s)?.id === r.id && !eatenEntry(key, s, r.id))?.[0] || r.meals[0];
    logRecipe(r, slot, key, sv); S.sheet = null; render(); toast(`${Math.round(r.kcal*sv)} kcal als ${MEAL_T[slot]} erfasst`);
  },
  unlog(d){ const k = dkey(today()); S.log[k] = logOf(k).filter(e => e.id !== d.v); render(); },
  water(d){ const k = dkey(today()), v = Number(d.v); S.water[k] = (S.water[k] || 0) === v ? v - 1 : v; render(); },
  rmode(d){ S.rmode = d.v; render(); },
  rfilter(d){ S.rfilter = d.v; render(); },
  day(d){ S.selDay = d.v; render(); },
  week(d){ S.selDay = dkey(addDays(parseKey(S.selDay), Number(d.v))); render(); },
  pick(d){ openSheet({type:'pick', key:d.k, slot:d.v}); },
  pickSet(d){ const {key, slot} = S.sheet; (S.plan[key] ||= {})[slot] = d.v; S.sheet = null; render(); toast(d.v ? 'Eingeplant' : 'Mahlzeit geleert'); },
  planTo(d){ openSheet({type:'planTo', id:d.v, day:dkey(addDays(today(), 1)), slot:getR(d.v).meals[0]}); },
  ptDay(d){ S.sheet.day = d.v; render(); },
  ptSlot(d){ S.sheet.slot = d.v; render(); },
  ptSave(){ const {id, day, slot} = S.sheet; (S.plan[day] ||= {})[slot] = id; S.sheet = null; render(); toast(`Eingeplant: ${parseKey(day).toLocaleDateString('de-CH',{weekday:'long'})}, ${MEAL_T[slot]}`); },
  qSlot(d){ S.sheet.slot = d.v; render(); },
  qAdd(d){ const q = QUICK[d.v], k = dkey(today()); (S.log[k] ||= []).push({id:uid(), slot:S.sheet.slot, name:q[0], kcal:q[1], p:q[2], c:q[3], f:q[4]}); S.sheet = null; render(); toast(`${q[0]} erfasst`); },
  addTraining(){ openSheet({type:'addTraining', draft:{type:'laufen', name:SPORTS.laufen.t, date:S.selDay, time:'18:00', dur:45, int:'mittel'}}); },
  dType(d){ const dr = S.sheet.draft; if (!dr.name || Object.values(SPORTS).some(s => s.t === dr.name)) dr.name = SPORTS[d.v].t; dr.type = d.v; render(); },
  dDate(d){ S.sheet.draft.date = d.v; render(); },
  dInt(d){ S.sheet.draft.int = d.v; render(); },
  delTraining(d){ S.trainings = S.trainings.filter(t => t.id !== d.v); render(); toast('Training gelöscht'); },
  garmin(){ openSheet({type:'garmin', phase:'consent'}); },
  gallow(){
    S.sheet.phase = 'sync'; render();
    setTimeout(() => {
      S.garmin.connected = true;
      const t = today(), have = S.trainings.some(x => x.src === 'garmin');
      if (!have){
        S.trainings.push({id:uid(), date:dkey(addDays(t,-1)), time:'07:10', type:'laufen', name:'Lauf locker · 8.2 km', dur:48, int:'locker', src:'garmin'});
        S.trainings.push({id:uid(), date:dkey(addDays(t,-4)), time:'12:05', type:'rad', name:'Rad · 32.5 km', dur:75, int:'mittel', src:'garmin'});
      }
      S.sheet = null; render(); toast('Garmin verbunden · 2 Aktivitäten importiert');
    }, 1600);
  },
  gsync(){ toast('Garmin synchronisiert · keine neuen Aktivitäten'); },
  gdisconnect(){ S.garmin.connected = false; S.trainings = S.trainings.filter(x => x.src !== 'garmin'); S.sheet = null; render(); toast('Garmin getrennt'); },
  shopTog(d){ S.shopDone[d.v] = !S.shopDone[d.v]; render(); },
  reOnboard(){ S.sheet = null; S.onboarded = false; S.step = 1; render(); },
  reset(){
    if (S.sheet?.confirmReset){ S = fresh(); lastView = ''; render(); toast('Prototyp zurückgesetzt'); return; }
    S.sheet.confirmReset = true; toast('Nochmals tippen, um alles zu löschen');
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (fn) fn(el.dataset, el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f){
    const k = el.dataset.f;
    S.profile[k] = (el.type === 'number' || el.type === 'range') ? Number(el.value) : el.value;
    if (k === 'bf'){ const v = $('#bfv'); if (v) v.textContent = el.value + ' %'; }
    if (['weight','height'].includes(k)){ const b = $('#bmi'); if (b) b.textContent = calc().bmi.toFixed(1); }
    save();
  }
  if (el.dataset.d && S.sheet?.draft) S.sheet.draft[el.dataset.d] = el.type === 'number' ? Number(el.value) : el.value;
  if (el.id === 'q'){ S.q = el.value; const l = $('#rlist'); if (l) l.innerHTML = recipeGrid(); }
});
document.addEventListener('submit', e => {
  const f = e.target.dataset.form; if (!f) return; e.preventDefault();
  const val = id => document.getElementById(id)?.value ?? '';
  if (f === 'weigh'){
    const kg = parseFloat(val('f-weigh').replace(',', '.'));
    if (!(kg > 30 && kg < 300)){ toast('Bitte ein Gewicht zwischen 30 und 300 kg eingeben'); return; }
    const k = dkey(today()); S.weights = S.weights.filter(w => w.d !== k); S.weights.push({d:k, kg:+kg.toFixed(1)}); S.profile.weight = +kg.toFixed(1);
    render(); toast(`${kg.toFixed(1)} kg eingetragen · Ziele neu berechnet`);
  }
  if (f === 'quick'){
    const k = dkey(today()), kcal = Math.round(+val('q-k'));
    if (!val('q-n').trim() || !(kcal > 0)){ toast('Name und Kalorien angeben'); return; }
    (S.log[k] ||= []).push({id:uid(), slot:S.sheet.slot, name:val('q-n').trim(), kcal, p:Math.round(+val('q-p') || 0), c:0, f:0});
    S.sheet = null; render(); toast('Erfasst');
  }
  if (f === 'training'){
    const d = S.sheet.draft; d.dur = clamp(Math.round(+d.dur) || 45, 5, 600); if (!d.time) d.time = '18:00';
    S.trainings.push({id:uid(), ...d, name:(d.name || SPORTS[d.type].t).trim(), src:'manuell'}); S.selDay = d.date; S.sheet = null; render(); toast('Training gespeichert · Tipps aktualisiert');
  }
  if (f === 'own'){
    const n = val('o-n').trim(), kcal = Math.round(+val('o-k'));
    if (!n || !(kcal > 0)){ toast('Name und Kalorien angeben'); return; }
    const p = Math.round(+val('o-p') || 0), c = Math.round(+val('o-c') || 0), fat = Math.max(0, Math.round((kcal - p*4 - c*4)/9));
    const ing = val('o-i').split('\n').map(s => s.trim()).filter(Boolean).map(s => { const m = s.match(/^([\d.,]+)\s*(\S+)\s+(.+)$/); return m ? [parseFloat(m[1].replace(',', '.')), m[2], m[3]] : [0, '', s]; });
    const r = {id:'c' + uid(), custom:true, n, e:'🍽️', h:hashStr(n) % 360, meals:[val('o-m')], tags:[], diet:'vegan', al:[], kcal, p, c, f:fat, min:Math.round(+val('o-t') || 20), ing, st:val('o-s').split('\n').map(s => s.trim()).filter(Boolean)};
    S.custom.unshift(r); S.fav.unshift(r.id); S.rmode = 'sammlung'; S.tab = 'rezepte'; S.sheet = null; render(); toast('Rezept in deiner Sammlung gespeichert');
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet){ S.sheet = null; render(); } });

render();
</script>
</body>
